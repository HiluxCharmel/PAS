<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00288e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3755c3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006c4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ZS-PAS Text -->
  <text x="10" y="42" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#grad1)" letter-spacing="-0.5">ZS-PAS</text>

  <!-- Separator dots -->
  <circle cx="115" cy="30" r="3" fill="#006c4a"/>
  <circle cx="115" cy="38" r="3" fill="#006c4a"/>

  <!-- Subtitle -->
  <text x="125" y="28" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#00288e" letter-spacing="1.5">PORTO-NOVO</text>
  <text x="125" y="38" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#00288e" letter-spacing="1.5">AGUÉGUÈS</text>
  <text x="125" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#00288e" letter-spacing="1.5">SÈMÈ-PODJI</text>

  <!-- Health cross icon -->
  <g transform="translate(185, 15)">
    <rect x="0" y="8" width="12" height="24" rx="3" fill="url(#grad2)"/>
    <rect x="4" y="0" width="24" height="12" rx="3" fill="url(#grad2)"/>
  </g>

  <!-- République du Bénin badge -->
  <text x="10" y="55" font-family="Inter, Arial, sans-serif" font-size="7" font-weight="700" fill="#006c4a" letter-spacing="0.5">RÉPUBLIQUE DU BÉNIN • MINISTÈRE DE LA SANTÉ • DDS OUÉMÉ</text>
</svg>