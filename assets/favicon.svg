<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00288e" />
      <stop offset="100%" style="stop-color:#3755c3" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006c4a" />
      <stop offset="100%" style="stop-color:#10b981" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Health cross -->
  <rect x="10" y="4" width="12" height="24" rx="2" fill="url(#cross)"/>
  <rect x="4" y="10" width="24" height="12" rx="2" fill="url(#cross)"/>

  <!-- Small accent dot -->
  <circle cx="26" cy="6" r="2.5" fill="#FFD700"/>
</svg>